# Cấu hình mẫu Nginx Reverse Proxy (Dùng khi cài Nginx trên Host hoặc Cloudflare/Certbot SSL)
# Đặt file này vào /etc/nginx/sites-available/mucis và symlink sang /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com; # Thay bằng tên miền của bạn (ví dụ: mucis.mydomain.com)

    # Tối ưu kích thước body và buffer cho streaming âm thanh
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Header forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ HTTP 206 Partial Content & Range Requests cho thẻ <audio>
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Tắt proxy buffering để stream nhạc truyền tức thì, không bị delay
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
